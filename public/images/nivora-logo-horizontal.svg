  <text x="158" y="96" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#E14D2A" letter-spacing="0.18em">BIMBINGAN BELAJAR &amp; AKADEMIK</text>
