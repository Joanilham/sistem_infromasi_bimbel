<!DOCTYPE html>
<html>
<head>

</head>
<body>
    <div id="sidebar">
        <div class="item">1</div><div class="item">2</div><div class="item">3</div>

    <script>

        console.log("scrollTop set to 200. Actual:", sb.scrollTop);
    </script>
</body>
</html>
