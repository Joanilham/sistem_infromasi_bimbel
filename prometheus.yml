global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'laravel_app'
    metrics_path: '/prometheus'
    # Use host.docker.internal to reach the host machine from within the docker container
    # Since Laravel might be running on php artisan serve (port 8000) or Valet/Herd (port 80/443)
    # We will assume it's running via php artisan serve on port 8000 for local dev
    static_configs:
      - targets: ['host.docker.internal:8000']
