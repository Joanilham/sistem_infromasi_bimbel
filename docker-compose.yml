services:
  # Laravel App (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    deploy:
      replicas: 1
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    networks:
      - geniusedu
    mem_limit: 2g
    memswap_limit: 2560m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started


  # Nginx Web Server (with ModSecurity WAF)
  nginx:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: geniusedu-nginx
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8080"
      - "8080:8080"
    environment:
      - PORT=8080
      - MODSEC_RULE_ENGINE=on
      - PARANOIA=1
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/templates/conf.d/default.conf.template
      - ./docker/nginx/crs-exclusions.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
    networks:
      - geniusedu
    mem_limit: 128m
    memswap_limit: 192m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - app

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: geniusedu-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/optimized.cnf:ro
    networks:
      - geniusedu
    mem_limit: 1g
    memswap_limit: 1280m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Session
  redis:
    image: redis:alpine
    container_name: geniusedu-redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    networks:
      - geniusedu
    mem_limit: 96m
    memswap_limit: 128m

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geniusedu-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    networks:
      - geniusedu
    mem_limit: 256m
    memswap_limit: 384m
    depends_on:
      mysql:
        condition: service_healthy

  # Scheduler Worker (Cron)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geniusedu-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    networks:
      - geniusedu
    mem_limit: 256m
    memswap_limit: 384m
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
  vendor_data:
    driver: local
  node_modules_data:
    driver: local

networks:
  geniusedu:
    driver: bridge
