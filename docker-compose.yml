services:
  # Laravel App (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - node_modules_data:/var/www/html/node_modules
    networks:
      - geniusedu
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started


  # Nginx Web Server (with ModSecurity WAF)
  nginx:
    image: owasp/modsecurity-crs:nginx-alpine
    container_name: geniusedu-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENFORCE_MODSECURITY=1
      - PARANOIA=1
      - SEC_RULE_ENGINE=DetectionOnly
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/templates/conf.d/default.conf.template
    networks:
      - geniusedu
    depends_on:
      - app

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: geniusedu-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - geniusedu
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Session
  redis:
    image: redis:alpine
    container_name: geniusedu-redis
    restart: unless-stopped
    networks:
      - geniusedu

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: geniusedu-pma
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8081:80"
    networks:
      - geniusedu
    depends_on:
      mysql:
        condition: service_healthy

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geniusedu-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --sleep=3
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    networks:
      - geniusedu
    depends_on:
      mysql:
        condition: service_healthy

  # Scheduler Worker (Cron)
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geniusedu-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
    networks:
      - geniusedu
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
  vendor_data:
    driver: local
  node_modules_data:
    driver: local

networks:
  geniusedu:
    driver: bridge
